name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    env:
      USING_COVERAGE: "3.11"

    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Install Dependencies
        run: |
          uv sync
          uv pip install tox-gh-actions
      - name: Test with tox
        run: uv run tox -e py${{ matrix.python-version }}
      - name: Test with tox linter
        run: uv run tox -e check-all
      - name: Upload coverage to Codecov
        if: |
          contains(env.USING_COVERAGE, matrix.python-version) 
          && matrix.platform == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  package:
    name: Build package
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install build

      - name: Build package
        run: pyproject-build

      - name: Show result
        run: ls -l dist

      - name: Install package
        run: python -m pip install .

      - name: Import package
        run: python -c "import pytred; print(pytred.__version__)"

      - name: Check CLI entry point
        run: pytred --version

  graph:
    name: Bundled notebook graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/pytred/static
