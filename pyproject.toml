[project]
name = "pytred"
dynamic = ["version"]
description = "Python Tools for Refinement and Enhancement of Data"
authors = [{ name = "Shinichi Kanehira", email = "skanehir1126@gmail.com" }]
dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "numpy",
    "typing-extensions>=4.10",
    "pyarrow>=11",
    "matplotlib",
    "pydantic>=2.13.5",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "tox-uv",
    "mkdocs>=1.5.3",
    "pytest>=8.1.1",
    "ipykernel>=6.29.3",
    "scikit-learn>=1.1",
    "mkdocstrings>=0.24.1",
    "mkdocs-material>=9.5.14",
    "mkdocstrings-python>=1.9.0",
    "mkdocs-jupyter>=0.24.6",
    "jupyterlab>=4.2.5",
    "tox-uv>=1.11.2",
]

[tool.hatch.version]
path = "src/pytred/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
exclude = ['tests']
ignore_missing_imports = true

[tool.black]
line-length = 99
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 99

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # mccabe
    "C",
    # isrot
    "I",
    # flake8-bugbear
    "B",
    # pyupgrade
    "UP",
    # Pylint
    # "PL",
]
ignore = [
    "E203",
    "D211", # Conflict D203
    "D212", # Conflict D213
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.flit.sdist]
include = ["frontend/", "src/pytred/static/"]
exclude = [
    "frontend/node_modules/",
    "frontend/test-results/",
    "frontend/playwright-report/",
]
